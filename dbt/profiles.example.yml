# Copy to dbt/profiles.yml (git-ignored) and keep every value in the environment:
#   cp dbt/profiles.example.yml dbt/profiles.yml
# Variables come from the repository's .env (see .env.example). Nothing secret belongs in this file.
retail:
  target: oauth
  outputs:
    # OAuth user-to-machine: dbt opens a browser to sign in. No secret is stored anywhere.
    oauth:
      type: databricks
      catalog: "{{ env_var('RETAIL_CATALOG', 'workspace') }}"
      schema: retail_gold
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      threads: 4
    # Personal access token, if OAuth is not available. The token stays in .env only.
    token:
      type: databricks
      catalog: "{{ env_var('RETAIL_CATALOG', 'workspace') }}"
      schema: retail_gold
      host: "{{ env_var('DATABRICKS_HOST') | replace('https://', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DATABRICKS_TOKEN') }}"
      threads: 4
