<!-- Legend and caption -->
<text class="lg" x="40" y="616" font-weight="700">Legend</text>
<rect x="110" y="604" width="26" height="16" rx="4" fill="#f5f8ff" stroke="#4a72d9" stroke-width="2"/>
<text class="lg" x="144" y="616">Built in this project (badge shows the phase)</text>
<rect x="480" y="604" width="26" height="16" rx="4" fill="#fffaf2" stroke="#e09a3e" stroke-width="2"/>
<text class="lg" x="514" y="616">Depends on a feature not yet verified</text>
<rect x="800" y="604" width="26" height="16" rx="4" fill="#ffffff" stroke="#cdd3db" stroke-width="1.5"/>
<text class="lg" x="834" y="616">Platform feature, used as is</text>
<rect class="pill" x="1060" y="603" width="28" height="18" rx="9"/><text class="pl" x="1074" y="615.5" text-anchor="middle">C1</text>
<text class="lg" x="1096" y="616">landing contract</text>
<rect class="pill" x="1220" y="603" width="28" height="18" rx="9"/><text class="pl" x="1234" y="615.5" text-anchor="middle">C2</text>
<text class="lg" x="1256" y="616">silver contract</text>
<rect class="pill" x="1370" y="603" width="28" height="18" rx="9"/><text class="pl" x="1384" y="615.5" text-anchor="middle">C3</text>
<text class="lg" x="1406" y="616">gold contract</text>
<text class="cap" x="40" y="650">Each tool writes only to its own schemas. Bad rows go to quarantine instead of failing the run; invalid references are kept and flagged, not rejected,</text>
<text class="cap" x="40" y="670">because a parent record can arrive in a later batch. Contracts are defined in docs/data_contracts.md.</text>
