<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1450" height="770" viewBox="0 0 1450 770" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Resilience test sequence</title>
<defs>
<style>
.title{font-size:20px;font-weight:700;fill:#111827}
.pt{font-size:15px;font-weight:700}
.box{fill:#ffffff;stroke:#cdd3db;stroke-width:1.5}
.verify .box{fill:#fffaf2;stroke:#e09a3e;stroke-width:2}
.ct{font-size:14px;font-weight:700;fill:#111827}
.cs{font-size:11.5px;fill:#4b5563}
.ic{fill:none;stroke:#ffffff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b-verify{fill:#e09a3e}
.bt{font-size:9.5px;font-weight:700;fill:#ffffff;letter-spacing:0.4px}
.edge{fill:none;stroke:#6b7280;stroke-width:1.5}
.el{font-size:11.5px;fill:#374151}
.lg{font-size:12.5px;fill:#111827}
.cap{font-size:12.5px;fill:#374151}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></symbol>
<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
<symbol id="i-compare" viewBox="0 0 24 24"><path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/></symbol>
<symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></symbol>
<symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/></symbol>
</defs>

<rect width="1450" height="770" fill="#ffffff"/>
<text class="title" x="40" y="42">Resilience test sequence - workspace states in Phase 06</text>

<!-- Panels -->
<rect x="30" y="70" width="1390" height="170" rx="14" fill="#fdf4f3" stroke="#d9534f" stroke-width="2"/>
<text class="pt" x="50" y="98" fill="#b03a36">1. Anomalous state, as left by Phase 05</text>
<rect x="30" y="270" width="1390" height="170" rx="14" fill="#f1faf8" stroke="#3aa395" stroke-width="2"/>
<text class="pt" x="50" y="298" fill="#227a6e">2. Clean state - anomaly batches removed, full refresh</text>
<rect x="30" y="470" width="1390" height="170" rx="14" fill="#fdf4f3" stroke="#d9534f" stroke-width="2"/>
<text class="pt" x="50" y="498" fill="#b03a36">3. Anomalous state again - batches delivered late</text>

<!-- Edges -->
<path class="edge" d="M350,169 H400" marker-end="url(#arrow)"/>
<path class="edge" d="M550,213 V250 H200 V323" marker-end="url(#arrow)"/>
<path class="edge" d="M350,369 H400" marker-end="url(#arrow)"/>
<path class="edge" d="M550,413 V450 H200 V523" marker-end="url(#arrow)"/>
<path class="edge" d="M350,569 H400" marker-end="url(#arrow)"/>
<path class="edge" d="M700,569 H750" marker-end="url(#arrow)"/>
<path class="edge" d="M1050,569 H1100" marker-end="url(#arrow)"/>

<!-- Row 1 -->
<g class="verify" transform="translate(50,125)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#c2463f"/>
  <use xlink:href="#i-check" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Baseline job run</text>
  <text class="cs" x="70" y="55">AC10b, R3 bad records, R4 drift,</text>
  <text class="cs" x="70" y="70">R5a late versions</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">STEP 6</text>
</g>
<g class="verify" transform="translate(400,125)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#5f6b7a"/>
  <use xlink:href="#i-x" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">R8 negative test</text>
  <text class="cs" x="70" y="55">dataset=clean on anomalous data;</text>
  <text class="cs" x="70" y="70">reconciliation must fail</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">STEP 7</text>
</g>

<!-- Row 2 -->
<g class="verify" transform="translate(50,325)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#a5682a"/>
  <use xlink:href="#i-trash" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">R6 recovery</text>
  <text class="cs" x="70" y="55">Remove batch_004 to 013, full</text>
  <text class="cs" x="70" y="70">refresh; silver = _expected</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">STEP 8</text>
</g>
<g class="verify" transform="translate(400,325)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#2e8f80"/>
  <use xlink:href="#i-compare" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">AC10a exact match</text>
  <text class="cs" x="70" y="55">Gold vs legacy ordered: zero</text>
  <text class="cs" x="70" y="70">differences; record V_clean</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">STEP 8</text>
</g>

<!-- Row 3 -->
<g class="verify" transform="translate(50,525)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#7c5cdb"/>
  <use xlink:href="#i-upload" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">R5b late delivery</text>
  <text class="cs" x="70" y="55">Batches re-uploaded; state equals</text>
  <text class="cs" x="70" y="70">Step 6, fingerprints included</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">STEP 9</text>
</g>
<g class="verify" transform="translate(400,525)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-undo" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">R7 gold rollback</text>
  <text class="cs" x="70" y="55">RESTORE to V_clean, then roll</text>
  <text class="cs" x="70" y="70">forward with gold and recon</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">STEP 10</text>
</g>
<g class="verify" transform="translate(750,525)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#3b6fd9"/>
  <use xlink:href="#i-clock" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">R1 rerun</text>
  <text class="cs" x="70" y="55">No new files; counts and</text>
  <text class="cs" x="70" y="70">fingerprints unchanged</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">STEP 11</text>
</g>
<g class="verify" transform="translate(1100,525)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#3c9a5f"/>
  <use xlink:href="#i-copy" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">R2 replay, optional</text>
  <text class="cs" x="70" y="55">batch_002 again as batch_902;</text>
  <text class="cs" x="70" y="70">bronze grows, silver unchanged</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">STEP 12</text>
</g>

<!-- Legend and caption -->
<text class="lg" x="40" y="686" font-weight="700">Legend</text>
<rect x="110" y="674" width="26" height="16" rx="4" fill="#fffaf2" stroke="#e09a3e" stroke-width="2"/>
<text class="lg" x="144" y="686">Test not yet run (badge shows the runbook step)</text>
<rect x="520" y="674" width="26" height="16" rx="4" fill="#fdf4f3" stroke="#d9534f" stroke-width="2"/>
<text class="lg" x="554" y="686">Landing holds the anomalous feed</text>
<rect x="840" y="674" width="26" height="16" rx="4" fill="#f1faf8" stroke="#3aa395" stroke-width="2"/>
<text class="lg" x="874" y="686">Landing holds the clean feed only</text>
<text class="cap" x="40" y="722">Every job run ends with the reconciliation task. Removing the anomaly batches and delivering them again is itself two of the tests: the</text>
<text class="cap" x="40" y="742">documented recovery for a bad batch, and a late delivery that must rebuild exactly the state the workspace started from.</text>
</svg>
