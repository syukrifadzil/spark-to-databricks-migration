<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1450" height="530" viewBox="0 0 1450 530" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Phase plan</title>
<defs>
<style>
.title{font-size:20px;font-weight:700;fill:#111827}
.pt{font-size:15px;font-weight:700}
.box{fill:#ffffff;stroke:#cdd3db;stroke-width:1.5}
.built .box{fill:#f5f8ff;stroke:#4a72d9;stroke-width:2}
.verify .box{fill:#fffaf2;stroke:#e09a3e;stroke-width:2}
.ct{font-size:14px;font-weight:700;fill:#111827}
.built .ct{fill:#2f5bcc}
.cs{font-size:11.5px;fill:#4b5563}
.ic{fill:none;stroke:#ffffff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b-built{fill:#4a72d9}
.b-verify{fill:#e09a3e}
.b-plan{fill:#9aa3af}
.bt{font-size:9.5px;font-weight:700;fill:#ffffff;letter-spacing:0.4px}
.edge{fill:none;stroke:#6b7280;stroke-width:1.5}
.lg{font-size:12.5px;fill:#111827}
.cap{font-size:12.5px;fill:#374151}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<symbol id="i-flow" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.5 6h7M7.3 8.2l3.5 7.4M16.7 8.2l-3.5 7.4"/></symbol>
<symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/></symbol>
<symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-compare" viewBox="0 0 24 24"><path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18M6 20v-7M11 20V5M16 20v-10"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
</defs>

<rect width="1450" height="530" fill="#ffffff"/>
<text class="title" x="40" y="42">Phase plan</text>

<!-- Panels -->
<rect x="30" y="70" width="1390" height="160" rx="14" fill="#f1faf8" stroke="#3aa395" stroke-width="2"/>
<text class="pt" x="50" y="98" fill="#227a6e">Reference and ingestion</text>
<rect x="30" y="270" width="1390" height="160" rx="14" fill="#f4f7fe" stroke="#6b8ee0" stroke-width="2"/>
<text class="pt" x="50" y="298" fill="#3858b8">Modelling, automation and proof</text>

<!-- Edges -->
<path class="edge" d="M350,159 H400" marker-end="url(#arrow)"/>
<path class="edge" d="M700,159 H750" marker-end="url(#arrow)"/>
<path class="edge" d="M1050,159 H1100" marker-end="url(#arrow)"/>
<path class="edge" d="M1250,203 V250 H320 V315" marker-end="url(#arrow)"/>
<path class="edge" d="M350,359 H400" marker-end="url(#arrow)"/>
<path class="edge" d="M700,359 H750" marker-end="url(#arrow)"/>
<path class="edge" d="M1050,359 H1100" marker-end="url(#arrow)"/>

<!-- Row 1 -->
<g class="built" transform="translate(50,115)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#3b6fd9"/>
  <use xlink:href="#i-doc" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">00 Foundation</text>
  <text class="cs" x="70" y="55">Architecture, contracts, ADRs,</text>
  <text class="cs" x="70" y="70">workspace namespace</text>
  <rect class="b-built" x="216" y="-9" width="74" height="18" rx="9"/>
  <text class="bt" x="253" y="3.5" text-anchor="middle">COMPLETE</text>
</g>
<g class="built" transform="translate(400,115)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#7c5cdb"/>
  <use xlink:href="#i-table" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">01 Synthetic data</text>
  <text class="cs" x="70" y="55">Deterministic CSVs, batches,</text>
  <text class="cs" x="70" y="70">anomalies, validators</text>
  <rect class="b-built" x="216" y="-9" width="74" height="18" rx="9"/>
  <text class="bt" x="253" y="3.5" text-anchor="middle">COMPLETE</text>
</g>
<g class="built" transform="translate(750,115)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#a5682a"/>
  <use xlink:href="#i-gear" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">02 Legacy Spark</text>
  <text class="cs" x="70" y="55">Reference job and baseline</text>
  <text class="cs" x="70" y="70">metrics, run locally</text>
  <rect class="b-built" x="216" y="-9" width="74" height="18" rx="9"/>
  <text class="bt" x="253" y="3.5" text-anchor="middle">COMPLETE</text>
</g>
<g class="built" transform="translate(1100,115)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#c2463f"/>
  <use xlink:href="#i-flow" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">03 Bronze and silver</text>
  <text class="cs" x="70" y="55">Auto Loader, expectations,</text>
  <text class="cs" x="70" y="70">quarantine, AUTO CDC</text>
  <rect class="b-built" x="216" y="-9" width="74" height="18" rx="9"/>
  <text class="bt" x="253" y="3.5" text-anchor="middle">COMPLETE</text>
</g>

<!-- Row 2 -->
<g class="built" transform="translate(50,315)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-chart" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">04 dbt gold</text>
  <text class="cs" x="70" y="55">Staging, marts, tests, docs</text>
  <text class="cs" x="70" y="70">on the SQL warehouse</text>
  <rect class="b-built" x="216" y="-9" width="74" height="18" rx="9"/>
  <text class="bt" x="253" y="3.5" text-anchor="middle">COMPLETE</text>
</g>
<g class="built" transform="translate(400,315)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#5f6b7a"/>
  <use xlink:href="#i-clock" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">05 Orchestration and CI</text>
  <text class="cs" x="70" y="55">Job, bundle config, GitHub</text>
  <text class="cs" x="70" y="70">Actions without secrets</text>
  <rect class="b-built" x="216" y="-9" width="74" height="18" rx="9"/>
  <text class="bt" x="253" y="3.5" text-anchor="middle">COMPLETE</text>
</g>
<g class="built" transform="translate(750,315)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#2e8f80"/>
  <use xlink:href="#i-compare" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">06 Reconciliation</text>
  <text class="cs" x="70" y="55">Legacy versus gold; reruns,</text>
  <text class="cs" x="70" y="70">drift and recovery tests</text>
  <rect class="b-built" x="216" y="-9" width="74" height="18" rx="9"/>
  <text class="bt" x="253" y="3.5" text-anchor="middle">COMPLETE</text>
</g>
<g class="verify" transform="translate(1100,315)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#3c9a5f"/>
  <use xlink:href="#i-check" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">07 Benchmark, portfolio</text>
  <text class="cs" x="70" y="55">Measured results only;</text>
  <text class="cs" x="70" y="70">narrative and decision log</text>
  <rect class="b-verify" x="216" y="-9" width="74" height="18" rx="9"/>
  <text class="bt" x="253" y="3.5" text-anchor="middle">IN REVIEW</text>
</g>

<!-- Legend and caption -->
<text class="lg" x="40" y="474" font-weight="700">Legend</text>
<rect x="110" y="462" width="26" height="16" rx="4" fill="#f5f8ff" stroke="#4a72d9" stroke-width="2"/>
<text class="lg" x="144" y="474">Complete</text>
<rect x="230" y="462" width="26" height="16" rx="4" fill="#fffaf2" stroke="#e09a3e" stroke-width="2"/>
<text class="lg" x="264" y="474">In review</text>
<rect x="350" y="462" width="26" height="16" rx="4" fill="#ffffff" stroke="#cdd3db" stroke-width="1.5"/>
<text class="lg" x="384" y="474">Planned</text>
<text class="cap" x="40" y="506">Each phase starts only after the previous one has been run, reviewed and committed. The legacy job comes before the Lakehouse because its outputs are the reference the new platform must reproduce.</text>
</svg>
