<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1630" height="700" viewBox="0 0 1630 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Incremental ingestion and idempotency</title>
<defs>
<style>
.title{font-size:20px;font-weight:700;fill:#111827}
.pt{font-size:15px;font-weight:700}
.box{fill:#ffffff;stroke:#cdd3db;stroke-width:1.5}
.built .box{fill:#f5f8ff;stroke:#4a72d9;stroke-width:2}
.verify .box{fill:#fffaf2;stroke:#e09a3e;stroke-width:2}
.ct{font-size:14px;font-weight:700;fill:#111827}
.built .ct{fill:#2f5bcc}
.cs{font-size:11.5px;fill:#4b5563}
.ic{fill:none;stroke:#ffffff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b-built{fill:#4a72d9}
.b-verify{fill:#e09a3e}
.bt{font-size:9.5px;font-weight:700;fill:#ffffff;letter-spacing:0.4px}
.edge{fill:none;stroke:#6b7280;stroke-width:1.5}
.dash{stroke-dasharray:5 4}
.sc{fill:#ffffff;stroke:#374151;stroke-width:1.2}
.sn{font-size:10.5px;font-weight:700;fill:#111827}
.el{font-size:11.5px;fill:#374151}
.lg{font-size:12.5px;fill:#111827}
.cap{font-size:12.5px;fill:#374151}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
<symbol id="i-flow" viewBox="0 0 24 24"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8.5 6h7M7.3 8.2l3.5 7.4M16.7 8.2l-3.5 7.4"/></symbol>
<symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/></symbol>
<symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="5.5" rx="8" ry="2.5"/><path d="M4 5.5v13c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5v-13M4 12c0 1.4 3.6 2.5 8 2.5s8-1.1 8-2.5"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></symbol>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
<symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.5l9 16H3z"/><path d="M12 10v4.5M12 17.2v0.3"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></symbol>
</defs>

<rect width="1630" height="700" fill="#ffffff"/>
<text class="title" x="40" y="42">Incremental ingestion and idempotency</text>

<!-- Panels -->
<rect x="140" y="70" width="1060" height="320" rx="14" fill="#fdf4f3" stroke="#d9534f" stroke-width="2"/>
<text class="pt" x="160" y="98" fill="#b03a36">Databricks workspace - one pipeline update</text>
<rect x="140" y="420" width="1060" height="170" rx="14" fill="#f7f8fa" stroke="#9aa3af" stroke-width="2"/>
<text class="pt" x="160" y="448" fill="#4b5563">Idempotency guarantees</text>
<rect x="1230" y="70" width="370" height="520" rx="14" fill="#f4f7fe" stroke="#6b8ee0" stroke-width="2"/>
<text class="pt" x="1250" y="98" fill="#3858b8">Silver ordering rules</text>

<!-- Maintainer -->
<rect x="40" y="136" width="56" height="56" rx="10" fill="#d98a2b"/>
<use xlink:href="#i-user" class="ic" x="52" y="148" width="32" height="32"/>
<text class="lg" x="68" y="212" text-anchor="middle" font-weight="700">Maintainer</text>

<!-- Edges -->
<path class="edge" d="M96,164 H170" marker-end="url(#arrow)"/>
<path class="edge" d="M68,220 V314 H170" marker-end="url(#arrow)"/>
<path class="edge" d="M320,208 V270" marker-end="url(#arrow)"/>
<path class="edge dash" d="M470,300 H500 V164 H530" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<path class="edge" d="M470,330 H530" marker-end="url(#arrow)"/>
<path class="edge" d="M830,314 H890" marker-end="url(#arrow)"/>

<!-- Workspace cards -->
<g class="built" transform="translate(170,120)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-folder" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Landing volume</text>
  <text class="cs" x="70" y="55">New folder per batch; files</text>
  <text class="cs" x="70" y="70">are never edited or deleted</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 00</text>
</g>
<g transform="translate(530,120)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#5f6b7a"/>
  <use xlink:href="#i-db" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Auto Loader checkpoint</text>
  <text class="cs" x="70" y="55">Remembers every file already</text>
  <text class="cs" x="70" y="70">ingested by this pipeline</text>
</g>
<g class="built" transform="translate(170,270)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#c2463f"/>
  <use xlink:href="#i-flow" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Pipeline update</text>
  <text class="cs" x="70" y="55">Triggered run; Auto Loader</text>
  <text class="cs" x="70" y="70">streams from the volume</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 03</text>
</g>
<g class="built" transform="translate(530,270)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#c2463f"/>
  <use xlink:href="#i-table" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Bronze tables</text>
  <text class="cs" x="70" y="55">Append every received row,</text>
  <text class="cs" x="70" y="70">replays included</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 03</text>
</g>
<g class="verify" transform="translate(890,270)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#c2463f"/>
  <use xlink:href="#i-db" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Silver tables</text>
  <text class="cs" x="70" y="55">Keyed upsert ordered by</text>
  <text class="cs" x="70" y="70">source_updated_at, then event id</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 03</text>
</g>

<!-- Guarantees -->
<g transform="translate(170,470)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-folder" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">File level</text>
  <text class="cs" x="70" y="55">Rerun with no new files reads</text>
  <text class="cs" x="70" y="70">nothing; tables unchanged</text>
</g>
<g transform="translate(530,470)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#c2463f"/>
  <use xlink:href="#i-table" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Row level</text>
  <text class="cs" x="70" y="55">Replayed rows reach bronze</text>
  <text class="cs" x="70" y="70">but cannot change silver</text>
</g>
<g transform="translate(890,470)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#3b6fd9"/>
  <use xlink:href="#i-refresh" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Rebuild level</text>
  <text class="cs" x="70" y="55">Full refresh from immutable</text>
  <text class="cs" x="70" y="70">files gives the same result</text>
</g>

<!-- Ordering rules -->
<g transform="translate(1265,115)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#3c9a5f"/>
  <use xlink:href="#i-check" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Replay</text>
  <text class="cs" x="70" y="55">Same key and sequence:</text>
  <text class="cs" x="70" y="70">no change</text>
</g>
<g transform="translate(1265,225)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#5f6b7a"/>
  <use xlink:href="#i-clock" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Late arrival</text>
  <text class="cs" x="70" y="55">Older than the current version:</text>
  <text class="cs" x="70" y="70">ignored for that key</text>
</g>
<g transform="translate(1265,335)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#3b6fd9"/>
  <use xlink:href="#i-refresh" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Correction</text>
  <text class="cs" x="70" y="55">Newer sequence: replaces the</text>
  <text class="cs" x="70" y="70">current version</text>
</g>
<g class="verify" transform="translate(1265,445)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-warn" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Equal sequence values</text>
  <text class="cs" x="70" y="55">Deterministic tie-breaker;</text>
  <text class="cs" x="70" y="70">confirm behaviour in Phase 03</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 03</text>
</g>

<!-- Step labels -->
<g transform="translate(122,150)"><circle class="sc" r="8.5"/><text class="sn" y="3.6" text-anchor="middle">1</text></g>
<g transform="translate(122,300)"><circle class="sc" r="8.5"/><text class="sn" y="3.6" text-anchor="middle">2</text></g>
<g transform="translate(332,239)"><rect x="-11" y="-10" width="94" height="20" rx="4" fill="#fdf4f3"/><circle class="sc" r="8.5"/><text class="sn" y="3.6" text-anchor="middle">3</text><text class="el" x="13" y="4">new files</text></g>
<g transform="translate(500,344)"><circle class="sc" r="8.5"/><text class="sn" y="3.6" text-anchor="middle">4</text></g>
<g transform="translate(860,300)"><circle class="sc" r="8.5"/><text class="sn" y="3.6" text-anchor="middle">5</text></g>

<!-- Legend and caption -->
<text class="lg" x="40" y="626" font-weight="700">Legend</text>
<rect x="110" y="614" width="26" height="16" rx="4" fill="#f5f8ff" stroke="#4a72d9" stroke-width="2"/>
<text class="lg" x="144" y="626">Built in this project (badge shows the phase)</text>
<rect x="480" y="614" width="26" height="16" rx="4" fill="#fffaf2" stroke="#e09a3e" stroke-width="2"/>
<text class="lg" x="514" y="626">Depends on behaviour not yet verified</text>
<rect x="800" y="614" width="26" height="16" rx="4" fill="#ffffff" stroke="#cdd3db" stroke-width="1.5"/>
<text class="lg" x="834" y="626">Platform feature or design property</text>
<text class="cap" x="40" y="660">1 upload a new batch folder · 2 start a pipeline update · 3 Auto Loader reads only files not yet in its checkpoint (dashed) · 4 append every row to bronze · 5 upsert valid rows into silver by key.</text>
<text class="cap" x="40" y="680">Starting another update with no new files reads nothing, so bronze and silver stay unchanged.</text>
</svg>
