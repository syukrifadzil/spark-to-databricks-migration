<!-- Legend and caption -->
<text class="lg" x="40" y="566" font-weight="700">Legend</text>
<rect x="110" y="554" width="26" height="16" rx="4" fill="#f5f8ff" stroke="#4a72d9" stroke-width="2"/>
<text class="lg" x="144" y="566">Built in this project (badge shows the phase)</text>
<rect x="480" y="554" width="26" height="16" rx="4" fill="#fffaf2" stroke="#e09a3e" stroke-width="2"/>
<text class="lg" x="514" y="566">Depends on a Free Edition feature not yet verified</text>
<rect x="884" y="554" width="26" height="16" rx="4" fill="#ffffff" stroke="#cdd3db" stroke-width="1.5"/>
<text class="lg" x="918" y="566">Platform service or tool, used as is</text>
<text class="cap" x="40" y="598">1 generate data · 2 run the legacy job on the same CSVs · 3-4 upload batches to the volume · 5 Auto Loader ingest · 6 silver tables · 7-8 dbt builds gold on the warehouse · 9 reconcile legacy with gold · 10-11 push and run CI.</text>
<text class="cap" x="40" y="618">Steps 5 to 8 run as one Databricks job if Free Edition supports it; otherwise the maintainer runs them by hand in the same order. CI never holds workspace credentials.</text>
