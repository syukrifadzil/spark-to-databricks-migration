<rect width="1510" height="780" fill="#ffffff"/>
<text class="title" x="40" y="42">dbt gold project - dbt/, built from the maintainer's machine</text>

<!-- Panels -->
<rect x="30" y="70" width="340" height="400" rx="14" fill="#fdf8f0" stroke="#e3a14a" stroke-width="2"/>
<text class="pt" x="50" y="98" fill="#b66d12">Inputs and connection</text>
<rect x="400" y="70" width="1080" height="400" rx="14" fill="#f7f8fa" stroke="#9aa3af" stroke-width="2"/>
<text class="pt" x="420" y="98" fill="#4b5563">Models - all built in retail_gold, read-only on retail_silver</text>
<rect x="30" y="500" width="1450" height="170" rx="14" fill="#f7f8fa" stroke="#9aa3af" stroke-width="2"/>
<text class="pt" x="50" y="528" fill="#4b5563">dbt build: tests run after the models they test; dbt docs shows the lineage</text>

<!-- Edges -->
<path class="edge" d="M350,184 H420" marker-end="url(#arrow)"/>
<path class="edge" d="M720,184 H780" marker-end="url(#arrow)"/>
<path class="edge" d="M570,228 V300" marker-end="url(#arrow)"/>
<path class="edge" d="M570,262 H930 V300" marker-end="url(#arrow)"/>
<path class="edge" d="M930,262 H1290 V300" marker-end="url(#arrow)"/>

<!-- Inputs -->
<g class="built" transform="translate(50,140)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#a5682a"/>
  <use xlink:href="#i-table" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">retail_silver, 5 tables</text>
  <text class="cs" x="70" y="55">Declared as dbt sources;</text>
  <text class="cs" x="70" y="70">owned by the Lakeflow pipeline</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 03</text>
</g>
<g class="verify" transform="translate(50,250)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#5f6b7a"/>
  <use xlink:href="#i-key" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Profile and .env</text>
  <text class="cs" x="70" y="55">OAuth sign-in, token fallback;</text>
  <text class="cs" x="70" y="70">nothing secret in git</text>
  <rect class="b-verify" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">VERIFY</text>
</g>
<g transform="translate(50,360)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#6b7280"/>
  <use xlink:href="#i-gear" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">SQL warehouse</text>
  <text class="cs" x="70" y="55">Serverless Starter Warehouse,</text>
  <text class="cs" x="70" y="70">2X-Small; runs every model</text>
  <rect class="b-plat" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PLATFORM</text>
</g>

<!-- Models -->
<g class="built" transform="translate(420,140)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#3b6fd9"/>
  <use xlink:href="#i-eye" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Staging, 5 views</text>
  <text class="cs" x="70" y="55">stg_*: business date, sold and</text>
  <text class="cs" x="70" y="70">succeeded flags, line total</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>
<g class="built" transform="translate(780,140)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#2f8a5b"/>
  <use xlink:href="#i-shield" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">int_order_balances</text>
  <text class="cs" x="70" y="55">Ephemeral: order totals and</text>
  <text class="cs" x="70" y="70">money, for business-rule tests</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>
<g class="built" transform="translate(420,300)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-chart" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">mart_daily_sales</text>
  <text class="cs" x="70" y="55">Table; one row per Kuala</text>
  <text class="cs" x="70" y="70">Lumpur business date</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>
<g class="built" transform="translate(780,300)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-user" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">mart_customer_lifetime_value</text>
  <text class="cs" x="70" y="55">Table; every customer, sold</text>
  <text class="cs" x="70" y="70">orders, gross, net paid</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>
<g class="built" transform="translate(1140,300)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-table" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">mart_product_performance</text>
  <text class="cs" x="70" y="55">Table; every product, units,</text>
  <text class="cs" x="70" y="70">gross, distinct sold orders</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>
<g class="built" transform="translate(1140,140)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#5f6b7a"/>
  <use xlink:href="#i-doc" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">business_date macro</text>
  <text class="cs" x="70" y="55">UTC+8 on epoch seconds; no</text>
  <text class="cs" x="70" y="70">session time zone dependence</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>

<!-- Tests -->
<g class="built" transform="translate(60,555)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#2f8a5b"/>
  <use xlink:href="#i-shield" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Source tests, 17</text>
  <text class="cs" x="70" y="55">Keys and domains: error;</text>
  <text class="cs" x="70" y="70">relationships: warn (orphans)</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>
<g class="built" transform="translate(420,555)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#2f8a5b"/>
  <use xlink:href="#i-shield" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Mart tests, 6</text>
  <text class="cs" x="70" y="55">Unique, not-null grain keys;</text>
  <text class="cs" x="70" y="70">failure means a model defect</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>
<g class="built" transform="translate(780,555)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#c0504d"/>
  <use xlink:href="#i-alert" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Business-rule tests, 8</text>
  <text class="cs" x="70" y="55">One per contract rule; warn,</text>
  <text class="cs" x="70" y="70">rows list the offending orders</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>
<g class="built" transform="translate(1140,555)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#5f6b7a"/>
  <use xlink:href="#i-eye" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">dbt docs</text>
  <text class="cs" x="70" y="55">Descriptions and lineage graph,</text>
  <text class="cs" x="70" y="70">served locally, not published</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 04</text>
</g>

<!-- Legend and caption -->
<text class="lg" x="40" y="710" font-weight="700">Legend</text>
<rect x="110" y="698" width="26" height="16" rx="4" fill="#f5f8ff" stroke="#4a72d9" stroke-width="2"/>
<text class="lg" x="144" y="710">Built in this project</text>
<rect x="300" y="698" width="26" height="16" rx="4" fill="#fff8ef" stroke="#e09a3e" stroke-width="2"/>
<text class="lg" x="334" y="710">Not yet verified in this workspace</text>
<rect x="590" y="698" width="26" height="16" rx="4" fill="#ffffff" stroke="#cdd3db" stroke-width="1.5"/>
<text class="lg" x="624" y="710">Platform service used as is</text>
<text class="cap" x="40" y="744">Mart definitions follow docs/data_contracts.md section 7, the same rules as the legacy job; column names match its baseline metrics SQL for Phase 06.</text>
<text class="cap" x="40" y="764">Error severity marks defects in the pipeline or the models; warn severity reports problems in the source data, which the build records without stopping.</text>
</svg>
