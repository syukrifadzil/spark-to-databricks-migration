<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1260" height="540" viewBox="0 0 1260 540" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>Source data model</title>
<defs>
<style>
.title{font-size:20px;font-weight:700;fill:#111827}
.pt{font-size:15px;font-weight:700}
.box{fill:#ffffff;stroke:#cdd3db;stroke-width:1.5}
.built .box{fill:#f5f8ff;stroke:#4a72d9;stroke-width:2}
.ct{font-size:14px;font-weight:700;fill:#111827}
.built .ct{fill:#2f5bcc}
.cs{font-size:11.5px;fill:#4b5563}
.ic{fill:none;stroke:#ffffff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.b-built{fill:#4a72d9}
.bt{font-size:9.5px;font-weight:700;fill:#ffffff;letter-spacing:0.4px}
.edge{fill:none;stroke:#6b7280;stroke-width:1.5}
.el{font-size:11.5px;fill:#374151}
.lg{font-size:12.5px;fill:#111827}
.cap{font-size:12.5px;fill:#374151}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker>
<symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></symbol>
<symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/></symbol>
<symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/></symbol>
<symbol id="i-chart" viewBox="0 0 24 24"><path d="M3 20h18M6 20v-7M11 20V5M16 20v-10"/></symbol>
<symbol id="i-compare" viewBox="0 0 24 24"><path d="M4 8h15M15 4l4 4-4 4M20 16H5M9 12l-4 4 4 4"/></symbol>
</defs>

<rect width="1260" height="540" fill="#ffffff"/>
<text class="title" x="40" y="42">Source data model</text>

<rect x="30" y="70" width="1200" height="360" rx="14" fill="#fdf8f0" stroke="#e3a14a" stroke-width="2"/>
<text class="pt" x="50" y="98" fill="#b66d12">Entities and relationships - contract 1.0.0 (data/contracts/retail_contract.json)</text>

<!-- Edges -->
<path class="edge" d="M360,184 H480" marker-end="url(#arrow)"/>
<path class="edge" d="M780,184 H900" marker-end="url(#arrow)"/>
<path class="edge" d="M1050,300 V228" marker-end="url(#arrow)"/>
<path class="edge" d="M630,228 V300" marker-end="url(#arrow)"/>

<g class="built" transform="translate(60,140)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-user" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">customers</text>
  <text class="cs" x="70" y="55">PK customer_id</text>
  <text class="cs" x="70" y="70">email, region changes; name fixes</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 01</text>
</g>
<g class="built" transform="translate(480,140)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#c2463f"/>
  <use xlink:href="#i-doc" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">orders</text>
  <text class="cs" x="70" y="55">PK order_id; FK customer_id</text>
  <text class="cs" x="70" y="70">status pending to delivered</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 01</text>
</g>
<g class="built" transform="translate(900,140)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#5a55c7"/>
  <use xlink:href="#i-table" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">order_items</text>
  <text class="cs" x="70" y="55">PK order_item_id; FK order_id,</text>
  <text class="cs" x="70" y="70">product_id; insert only</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 01</text>
</g>
<g class="built" transform="translate(480,300)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#3c9a5f"/>
  <use xlink:href="#i-compare" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">payments</text>
  <text class="cs" x="70" y="55">PK payment_id; FK order_id</text>
  <text class="cs" x="70" y="70">charge or refund; insert only</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 01</text>
</g>
<g class="built" transform="translate(900,300)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#2e8f80"/>
  <use xlink:href="#i-chart" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">products</text>
  <text class="cs" x="70" y="55">PK product_id</text>
  <text class="cs" x="70" y="70">price changes, discontinuation</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 01</text>
</g>

<!-- Cardinality labels -->
<text class="el" x="420" y="176" text-anchor="middle">1 : n</text>
<text class="el" x="840" y="176" text-anchor="middle">1 : n</text>
<g transform="translate(1062,264)"><rect x="-4" y="-10" width="40" height="20" rx="4" fill="#fdf8f0"/><text class="el" x="0" y="4">1 : n</text></g>
<g transform="translate(642,264)"><rect x="-4" y="-10" width="40" height="20" rx="4" fill="#fdf8f0"/><text class="el" x="0" y="4">1 : n</text></g>

<!-- Legend and caption -->
<text class="lg" x="40" y="470" font-weight="700">Legend</text>
<rect x="110" y="458" width="26" height="16" rx="4" fill="#f5f8ff" stroke="#4a72d9" stroke-width="2"/>
<text class="lg" x="144" y="470">Built in this project (badge shows the phase); arrows point from parent to child</text>
<text class="cap" x="40" y="504">Every file also carries source_updated_at, change_type, batch_id and event_id. The latest version of a record is the one with the greatest</text>
<text class="cap" x="40" y="524">(source_updated_at, event_id). Order total = sum of quantity x unit_price; net paid = succeeded charges - succeeded refunds.</text>
</svg>
