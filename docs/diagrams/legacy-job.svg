<path class="edge" d="M350,234 H385 V174 H420" marker-end="url(#arrow)"/>
<path class="edge" d="M720,174 H780" marker-end="url(#arrow)"/>
<path class="edge" d="M1080,174 H1140" marker-end="url(#arrow)"/>
<path class="edge" d="M1290,218 V244 H570 V270" marker-end="url(#arrow)"/>
<path class="edge" d="M720,314 H780" marker-end="url(#arrow)"/>
<path class="edge" d="M1080,314 H1140" marker-end="url(#arrow)"/>
<path class="edge" d="M1290,358 V480" marker-end="url(#arrow)"/>

<!-- Input -->
<g class="built" transform="translate(50,190)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-folder" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">Dataset folder</text>
  <text class="cs" x="70" y="55">batch_000 snapshot plus</text>
  <text class="cs" x="70" y="70">batch_001 onwards</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 01</text>
</g>

<!-- Job steps -->
<g class="built" transform="translate(420,130)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#a5682a"/>
  <use xlink:href="#i-doc" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">1 Read and stack files</text>
  <text class="cs" x="70" y="55">Every batch, every run; known</text>
  <text class="cs" x="70" y="70">columns only, all strings</text>
  <rect class="b-limit" x="216" y="-9" width="74" height="18" rx="9"/>
  <text class="bt" x="253" y="3.5" text-anchor="middle">L1 L2 L6</text>
</g>
<g class="built" transform="translate(780,130)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#a5682a"/>
  <use xlink:href="#i-refresh" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">2 Last file wins</text>
  <text class="cs" x="70" y="55">customers, products, orders:</text>
  <text class="cs" x="70" y="70">the row read last is kept</text>
  <rect class="b-limit" x="246" y="-9" width="44" height="18" rx="9"/>
  <text class="bt" x="268" y="3.5" text-anchor="middle">L3</text>
</g>
<g class="built" transform="translate(1140,130)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#a5682a"/>
  <use xlink:href="#i-table" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">3 Stack items, payments</text>
  <text class="cs" x="70" y="55">Assumed insert-only; no</text>
  <text class="cs" x="70" y="70">deduplication of replays</text>
  <rect class="b-limit" x="246" y="-9" width="44" height="18" rx="9"/>
  <text class="bt" x="268" y="3.5" text-anchor="middle">L4</text>
</g>
<g class="built" transform="translate(420,270)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#a5682a"/>
  <use xlink:href="#i-gear" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">4 Cast and parse</text>
  <text class="cs" x="70" y="55">Lenient casts, money as double,</text>
  <text class="cs" x="70" y="70">Kuala Lumpur business dates</text>
  <rect class="b-limit" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">L5 L8</text>
</g>
<g class="built" transform="translate(780,270)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#a5682a"/>
  <use xlink:href="#i-chart" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">5 Join and aggregate</text>
  <text class="cs" x="70" y="55">Inner joins to sold orders;</text>
  <text class="cs" x="70" y="70">rules from data_contracts C3</text>
  <rect class="b-limit" x="246" y="-9" width="44" height="18" rx="9"/>
  <text class="bt" x="268" y="3.5" text-anchor="middle">L7</text>
</g>
<g class="built" transform="translate(1140,270)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#a5682a"/>
  <use xlink:href="#i-folder" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">6 Overwrite outputs</text>
  <text class="cs" x="70" y="55">One CSV per mart, then the</text>
  <text class="cs" x="70" y="70">shared baseline metrics SQL</text>
  <rect class="b-limit" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">L9 L10</text>
</g>

<!-- Outputs -->
<g class="built" transform="translate(60,480)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-chart" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">daily_sales</text>
  <text class="cs" x="70" y="55">One row per business date:</text>
  <text class="cs" x="70" y="70">orders, sales, payments</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 02</text>
</g>
<g class="built" transform="translate(420,480)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-user" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">customer_lifetime_value</text>
  <text class="cs" x="70" y="55">One row per customer: orders,</text>
  <text class="cs" x="70" y="70">gross sales, net paid</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 02</text>
</g>
<g class="built" transform="translate(780,480)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#d98a2b"/>
  <use xlink:href="#i-table" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">product_performance</text>
  <text class="cs" x="70" y="55">One row per product: units,</text>
  <text class="cs" x="70" y="70">gross sales, orders</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 02</text>
</g>
<g class="built" transform="translate(1140,480)">
  <rect class="box" width="300" height="88" rx="8"/>
  <rect x="16" y="24" width="40" height="40" rx="9" fill="#5f6b7a"/>
  <use xlink:href="#i-doc" class="ic" x="24" y="32" width="24" height="24"/>
  <text class="ct" x="70" y="36">baseline_metrics.json</text>
  <text class="cs" x="70" y="55">Metrics from the shared SQL,</text>
  <text class="cs" x="70" y="70">Spark version, run duration</text>
  <rect class="b-built" x="226" y="-9" width="64" height="18" rx="9"/>
  <text class="bt" x="258" y="3.5" text-anchor="middle">PHASE 02</text>
</g>

<!-- Legend and caption -->
<text class="lg" x="40" y="640" font-weight="700">Legend</text>
<rect x="110" y="628" width="26" height="16" rx="4" fill="#f5f8ff" stroke="#4a72d9" stroke-width="2"/>
<text class="lg" x="144" y="640">Built in this project</text>
<rect x="300" y="629" width="44" height="14" rx="7" fill="#e09a3e"/>
<text class="lg" x="352" y="640">Deliberate limitations of that step, numbered as in the Phase 02 EXPLANATION</text>
<text class="cap" x="40" y="674">The business rules match docs/data_contracts.md section 7, so differences from the Lakehouse come from input handling, not from different definitions.</text>
<text class="cap" x="40" y="694">On a feed with no late arrivals or replays the legacy outputs should match the correct marts exactly; Phase 06 tests that.</text>
</svg>
