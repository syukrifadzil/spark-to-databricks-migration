<rect width="1510" height="710" fill="#ffffff"/>
<text class="title" x="40" y="42">Legacy nightly job - legacy_spark/retail_nightly_job.py</text>

<!-- Panels -->
<rect x="30" y="70" width="340" height="330" rx="14" fill="#fdf8f0" stroke="#e3a14a" stroke-width="2"/>
<text class="pt" x="50" y="98" fill="#b66d12">Input - data/raw/&lt;dataset&gt;</text>
<rect x="400" y="70" width="1080" height="330" rx="14" fill="#f7f8fa" stroke="#9aa3af" stroke-width="2"/>
<text class="pt" x="420" y="98" fill="#4b5563">Job - local PySpark, one script, run in full every night</text>
<rect x="30" y="430" width="1450" height="170" rx="14" fill="#f7f8fa" stroke="#9aa3af" stroke-width="2"/>
<text class="pt" x="50" y="458" fill="#4b5563">Outputs - output/legacy/&lt;dataset&gt;, overwritten each run</text>

